<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Суфлёр">
<title>Суфлёр</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 16px -apple-system, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  video.mirror { transform: scaleX(-1); }

  .panel { position: fixed; background: rgba(12, 16, 16, .88); border-radius: 14px; touch-action: none; }
  .handle { width: 28px; touch-action: none; cursor: grab; opacity: .6;
    background: radial-gradient(circle, #fff 1.5px, transparent 2px) center / 8px 8px; }
  .x { width: 32px; height: 32px; opacity: .7; }

  #strip { top: calc(env(safe-area-inset-top) + 8px); left: 8px; width: calc(100% - 16px); }
  #strip .row { display: flex; align-items: stretch; }
  #view { flex: 1; overflow: hidden; padding: 8px 0; }
  #line { display: inline-block; white-space: nowrap; font-weight: 600; will-change: transform; }
  #bar { display: flex; justify-content: space-around; padding: 0 28px 6px; }
  #bar button { width: 44px; height: 40px; font-size: 22px; }

  #joy { right: 8px; top: 38%; width: 132px; padding-bottom: 14px; }
  #joy .row { display: flex; justify-content: space-between; height: 32px; }
  #label { text-align: center; padding: 6px 0 10px; font-variant-numeric: tabular-nums; }
  #pad { position: relative; height: 150px; opacity: .9; }
  #pad::before { content: ""; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 2px; margin-left: -1px; background: #fff3; }
  #pad::after { content: ""; position: absolute; top: 50%; left: 22px; right: 22px; height: 2px; margin-top: -1px; background: #fff3; }
  #pad span { position: absolute; font-size: 15px; opacity: .8; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; z-index: 1;
    border-radius: 50%; background: #fff; color: #000; font-size: 18px; touch-action: none; }
  #knob.held { background: #b9f5c8; }

  #bottom { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 18px);
    display: flex; justify-content: space-around; align-items: center; }
  #bottom .side { width: 64px; height: 48px; border-radius: 24px; background: #0008; font-size: 15px; }
  #rec { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; padding: 5px; background: #0003; }
  #rec i { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: .15s; }
  .recording #rec i { background: #f33; border-radius: 8px; transform: scale(.5); }
  .recording #flip { visibility: hidden; }

  #save { left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 110px); display: flex; }
  #save button:first-child { flex: 1; height: 52px; font-weight: 600; }
  #save .x { height: 52px; width: 52px; }
  #flip { font-size: 26px; }
  #msg { top: 20%; left: 24px; right: 24px; padding: 16px; text-align: center; }

  #editor { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 12px); }
  #editor header { display: flex; justify-content: space-between; align-items: center; height: 44px; }
  #editor header button { font-weight: 600; color: #b9f5c8; padding: 8px; }
  #script { flex: 1; margin-top: 8px; padding: 12px; border-radius: 12px; border: 0; resize: none;
    background: #222; color: #fff; font: inherit; font-size: 18px; line-height: 1.4; user-select: text; -webkit-user-select: text; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<div id="strip" class="panel">
  <div class="row">
    <div class="handle" aria-label="Перетащить"></div>
    <div id="view"><span id="line"></span></div>
    <button class="x" data-close aria-label="Скрыть строку">✕</button>
  </div>
  <div id="bar">
    <button id="restart" aria-label="В начало">↺</button>
    <button id="fontDown" aria-label="Шрифт меньше" style="font-size:15px">A</button>
    <button id="fontUp" aria-label="Шрифт больше">A</button>
    <button id="play" aria-label="Пуск или пауза"></button>
    <button id="slower" aria-label="Медленнее">−</button>
    <button id="faster" aria-label="Быстрее">+</button>
    <button id="collapse" aria-label="Свернуть кнопки">⇤</button>
  </div>
</div>

<div id="joy" class="panel">
  <div class="row"><div class="handle" aria-label="Перетащить"></div><button class="x" data-close aria-label="Скрыть ползунок">✕</button></div>
  <div id="label"></div>
  <div id="pad">
    <span style="left:70%;top:8px">+</span><span style="left:70%;bottom:8px">−</span>
    <span style="left:14px;top:26%">«</span><span id="hint" style="right:14px;top:26%"></span>
    <button id="knob" aria-label="Темп: вверх быстрее, вниз медленнее, влево назад"></button>
  </div>
</div>

<div id="save" class="panel" hidden>
  <button id="saveBtn">Сохранить видео в галерею</button>
  <button id="discard" class="x" aria-label="Удалить запись">✕</button>
</div>
<div id="msg" class="panel" hidden></div>

<div id="bottom">
  <button id="edit" class="side">Текст</button>
  <button id="rec" aria-label="Запись"><i></i></button>
  <button id="flip" class="side" aria-label="Сменить камеру">⟲</button>
</div>

<div id="editor" hidden>
  <header><span>Сценарий</span><button id="done">Готово</button></header>
  <textarea id="script" placeholder="Вставьте сюда текст сценария"></textarea>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const PLAY = '▶︎', PAUSE = '❚❚';

// --- чистая логика (проверяется ассертами внизу) ---
// скорость строки: слов в минуту -> пикселей в секунду
const pxPerSec = (wpm, textWidth, words) => wpm / 60 * textWidth / words;
// кружок влево: немного — притормозить, дальше — перемотка назад; пауза остаётся паузой
const speedFactor = (jx, playing) => jx < -30 ? -4 : jx < -8 ? (playing ? .3 : 0) : playing ? 1 : 0;
console.assert(pxPerSec(120, 1000, 10) === 200);
console.assert(speedFactor(-40, false) === -4 && speedFactor(-15, true) === .3 && speedFactor(-15, false) === 0 && speedFactor(0, true) === 1);

// --- состояние ---
const st = Object.assign({
  text: 'Привет! Это суфлёр. Нажми «Текст» и вставь свой сценарий. Кружок справа: вверх — быстрее, вниз — медленнее, влево — назад.',
  wpm: 150, font: 28 }, JSON.parse(localStorage.tp || '{}'));
const persist = () => localStorage.tp = JSON.stringify(st);
let playing = false, pos = 0, textW = 1, words = 1, jx = 0, jy = 0;

function layout() {
  const k = pos / textW;
  $('line').textContent = st.text.replace(/\s+/g, ' ').trim();
  $('line').style.fontSize = st.font + 'px';
  textW = $('line').offsetWidth || 1;
  words = $('line').textContent.split(' ').length;
  pos = k * textW;
}

let last = 0;
function tick(t) {
  const dt = Math.min((t - last) / 1000, .1); last = t;
  if (jy) st.wpm = clamp(st.wpm - jy / 46 * 80 * dt, 40, 400);
  pos = clamp(pos + pxPerSec(st.wpm, textW, words) * speedFactor(jx, playing) * dt, 0, textW);
  if (pos >= textW) playing = false;
  $('line').style.transform = `translateX(${$('view').clientWidth * .4 - pos}px)`;
  const w = Math.round(st.wpm), lbl = playing ? w + ' сл/мин' : 'Пауза · ' + w, icon = playing ? PAUSE : PLAY;
  if ($('label').textContent !== lbl) $('label').textContent = lbl;
  if ($('knob').textContent !== icon) $('knob').textContent = $('play').textContent = $('hint').textContent = icon;
  requestAnimationFrame(tick);
}
const toggle = () => { if (pos >= textW) pos = 0; playing = !playing; };

// --- кнопки строки ---
$('restart').onclick = () => pos = 0;
$('play').onclick = toggle;
$('fontDown').onclick = () => { st.font = clamp(st.font - 2, 16, 64); layout(); persist(); };
$('fontUp').onclick = () => { st.font = clamp(st.font + 2, 16, 64); layout(); persist(); };
$('slower').onclick = () => { st.wpm = clamp(st.wpm - 10, 40, 400); persist(); };
$('faster').onclick = () => { st.wpm = clamp(st.wpm + 10, 40, 400); persist(); };
$('collapse').onclick = () => $('bar').hidden = true;
$('view').onclick = () => $('bar').hidden = false; // тап по строке возвращает кнопки
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.panel').hidden = true);

// --- кружок ---
const knob = $('knob');
let k0 = null, moved, flipped;
knob.onpointerdown = e => { knob.setPointerCapture(e.pointerId); k0 = [e.clientX, e.clientY]; moved = flipped = false; knob.classList.add('held'); };
knob.onpointermove = e => {
  if (!k0) return;
  let dx = clamp(e.clientX - k0[0], -46, 46), dy = clamp(e.clientY - k0[1], -46, 46);
  if (Math.hypot(dx, dy) > 6) moved = true;
  Math.abs(dx) > Math.abs(dy) ? dy = 0 : dx = 0;
  jx = dx; jy = dy;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  if (dx > 30 && !flipped) { flipped = true; toggle(); } // вправо — пуск/пауза
};
knob.onpointerup = knob.onpointercancel = () => {
  if (!k0) return;
  if (!moved) toggle();
  k0 = null; jx = jy = 0; knob.style.transform = ''; knob.classList.remove('held'); persist();
};

// --- перетаскивание панелей ---
document.querySelectorAll('.handle').forEach(h => {
  const p = h.closest('.panel'); let d = null;
  h.onpointerdown = e => { h.setPointerCapture(e.pointerId); const r = p.getBoundingClientRect(); d = [e.clientX - r.left, e.clientY - r.top]; };
  h.onpointermove = e => {
    if (!d) return;
    p.style.right = 'auto';
    p.style.left = clamp(e.clientX - d[0], 0, innerWidth - p.offsetWidth) + 'px';
    p.style.top = clamp(e.clientY - d[1], 0, innerHeight - p.offsetHeight) + 'px';
  };
  h.onpointerup = h.onpointercancel = () => d = null;
});

// --- сценарий ---
$('edit').onclick = () => { playing = false; $('script').value = st.text; $('editor').hidden = false; };
$('done').onclick = () => {
  st.text = $('script').value.trim() || st.text; persist();
  $('editor').hidden = true; $('strip').hidden = $('joy').hidden = false;
  pos = 0; layout();
};

// --- камера и запись ---
let stream, facing = 'user', rec, file, saved = true;
const say = t => { $('msg').textContent = t; $('msg').hidden = !t; };
async function camera() {
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  try {
    // без этих трёх «false» iPhone пишет звук в режиме телефонного звонка — глухо и с провалами
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) { return say('Нет доступа к камере. Разрешите камеру и микрофон и откройте заново.'); }
  say('');
  $('video').srcObject = stream;
  $('video').classList.toggle('mirror', facing === 'user');
  navigator.wakeLock?.request('screen').catch(() => {}); // чтобы экран не гас во время чтения
}
$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; camera(); };
document.onvisibilitychange = () => { // iOS отбирает камеру, когда приложение свёрнуто
  if (!document.hidden && !alive()) camera();
};
// после меню «Поделиться» iOS может заглушить камеру или микрофон, не сообщив об этом
const alive = () => !!stream && stream.getTracks().every(t => t.readyState === 'live' && !t.muted);

$('rec').onclick = async () => {
  if (rec?.state === 'recording') return rec.stop();
  if (!saved && !confirm('Прошлая запись не сохранена. Удалить её и снять новую?')) return;
  if (!alive()) await camera();
  if (!stream) return;
  const mimeType = ['video/mp4', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const chunks = [];
  try { rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 12e6, audioBitsPerSecond: 256e3 }); rec.start(); }
  catch (e) { return say('Запись не запустилась: ' + e.message); }
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const type = rec.mimeType.split(';')[0];
    file = new File(chunks, `sufler-${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`, { type });
    saved = false;
    document.body.classList.remove('recording'); $('save').hidden = false;
  };
  say(''); $('save').hidden = true;
  document.body.classList.add('recording');
};
$('saveBtn').onclick = async () => {
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) { return; } // отменил — запись остаётся
  } else { // не телефон: обычная загрузка файла
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(file), download: file.name });
    a.click();
  }
  saved = true; $('save').hidden = true;
  if (!alive()) camera();
};
$('discard').onclick = () => { if (confirm('Удалить запись без сохранения?')) { saved = true; file = null; $('save').hidden = true; } };

layout(); addEventListener('resize', layout);
requestAnimationFrame(tick);
camera();
</script>
</body>
</html>
